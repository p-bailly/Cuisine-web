<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuisine</title>
<script>
  // Ancienne copie du site, retirée : le vrai site est https://cuisine.pbailly.fr/ (Cloudflare, dépôt Cuisine).
  // On efface d'abord l'ancien service worker et ses caches, qui pourraient resservir l'ancienne appli.
  (async () => {
    try {
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.map((r) => r.unregister()));
      if (self.caches) await Promise.all((await caches.keys()).map((k) => caches.delete(k)));
    } catch (e) { /* rien à nettoyer */ }
    // Servie sous cuisine.pbailly.fr, cette page veut dire que le domaine pointe encore vers GitHub Pages : on va à
    // l'adresse de Cloudflare (pas de boucle), où le jeton est à ressaisir une fois (⚙).
    location.replace(location.hostname === 'cuisine.pbailly.fr' ? 'https://cuisine.plbailly25.workers.dev/' : 'https://cuisine.pbailly.fr/');
  })();
</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px">
<p><a href="https://cuisine.pbailly.fr/">cuisine.pbailly.fr</a> · <a href="https://cuisine.plbailly25.workers.dev/">cuisine.plbailly25.workers.dev</a></p>
</body>
</html>
