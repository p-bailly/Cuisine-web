<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuisine</title>
<script>
  // Ancienne copie du site, retirée : le vrai site est https://cuisine.pbailly.fr/ (Cloudflare, dépôt Cuisine).
  // On efface d'abord l'ancien service worker et ses caches, qui pourraient resservir l'ancienne appli.
  (async () => {
    try {
      const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
      await Promise.all(regs.map((r) => r.unregister()));
      if (self.caches) await Promise.all((await caches.keys()).map((k) => caches.delete(k)));
    } catch (e) { /* rien à nettoyer */ }
    // Servie sous cuisine.pbailly.fr, cette page voudrait dire que le domaine pointe encore vers GitHub Pages :
    // on ne redirige pas (boucle), on l'explique.
    if (location.hostname !== 'cuisine.pbailly.fr') location.replace('https://cuisine.pbailly.fr/');
    else document.getElementById('msg').hidden = false;
  })();
</script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px">
<p><a href="https://cuisine.pbailly.fr/">cuisine.pbailly.fr</a></p>
<p id="msg" hidden>Cette page est l'ancienne copie du site, servie par GitHub Pages : le domaine doit pointer vers Cloudflare.</p>
</body>
</html>
